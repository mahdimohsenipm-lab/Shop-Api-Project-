<!DOCTYPE html>
<html>
<head>
    <link href="css/StyleLogin.css" rel="stylesheet" />
    <meta charset="utf-8" />
    <title>ثبت‌نام</title>
</head>
<body>
    <div class="login-box">
        <h2>ثبت‌نام</h2>
        <form id="registerForm">
            <div class="input-group">
                <label>نام کاربری</label>
                <input type="text" id="fullName" placeholder="نام و نام خانوادگی" pattern="[a-zA-Z0-9]+"
                       title="لطفاً فقط حروف انگلیسی و اعداد وارد کنید" required />
            </div>

            <div class="input-group">
                <label>نام کامل</label>
                <input type="text" id="customerName" placeholder="نام و نام خانوادگی"  required/>
            </div>
            <div class="input-group">
                <label>ایمیل</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            <div class="input-group">
                <label>سن</label>
                <input type="number" id="age" placeholder="18" required>
            </div>
            <div class="input-group">
                <label>رمز عبور</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <div class="input-group">
                <label>تکرار رمز عبور</label>
                <input type="password" id="confirmPassword" placeholder="********" required>
            </div>
            <button type="submit">ایجاد حساب</button>
            <div class="extra">
                قبلاً ثبت‌نام کرده‌اید؟
                <a href="login.html">ورود</a>
            </div>
            <p id="registerMessage"></p>
        </form>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
