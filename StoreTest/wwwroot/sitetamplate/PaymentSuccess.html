<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت موفقیت‌آمیز</title>
    <style>
        @font-face {
            font-family: 'Yekan';
            src: url('/sitetamplate/fonts/yekan/Yekan.eot');
            src: url('/sitetamplate/fonts/yekan/Yekan.eot?#iefix') format('embedded-opentype'), url('/sitetamplate/fonts/yekan/Yekan.woff2') format('woff2'), url('/sitetamplate/fonts/yekan/Yekan.woff') format('woff'), url('/sitetamplate/fonts/yekan/Yekan.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        body {
            font-family: 'Yekan', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: #2ecc71;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 40px;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        h2 {
            color: #2ecc71;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .ref-code {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #ddd;
            margin: 20px 0;
            font-weight: bold;
            color: #333;
        }

        .btn {
            display: inline-block;
            background: #3498db;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 10px;
            transition: 0.3s;
            margin-top: 10px;
        }

            .btn:hover {
                background: #2980b9;
                transform: translateY(-2px);
            }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">✓</div>
        <h2>پرداخت موفق!</h2>
        <p>کاربر گرامی، تراکنش شما با موفقیت در سیستم ثبت شد.</p>
        <div class="ref-code">شماره پیگیری: <span id="refId">---</span></div>
        <a href="index.html" class="btn">بازگشت به پنل کاربری</a>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('refId').innerText = urlParams.get('refid') || 'نامشخص';
        localStorage.removeItem('cart'); 
    </script>
</body>
</html>
