<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تکمیل خرید</title>
    <link href="Fonts/font-awesome/font-awesome.min.css" rel="stylesheet" />
    <link href="css/checkout.css" rel="stylesheet" />

</head>
<body>
    <div class="checkout-container">
        <div class="checkout-header">
            <h1>تکمیل خرید</h1>
            <p>اطلاعات سفارش و مشخصات خود را بررسی و ثبت کنید</p>
        </div>
        <div class="checkout-content">
            <!-- فرم اطلاعات مشتری -->
            <div class="checkout-form-section">
                <h2>اطلاعات مشتری</h2>
                <form id="checkoutForm">
                    <div class="form-group">
                        <label for="fullName">نام و نام خانوادگی</label>
                        <input type="text" id="fullName" placeholder="مثلاً علی رضایی" required />
                    </div>
                    <div class="form-group">
                        <label for="phone">شماره تماس</label>
                        <input type="tel" id="phone" placeholder="09xxxxxxxxx" required />
                    </div>
                    <div class="form-group">
                        <label for="address">آدرس</label>
                        <textarea id="address" rows="4" placeholder="آدرس کامل خود را وارد کنید" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="note">توضیحات سفارش</label>
                        <textarea id="note" rows="3" placeholder="اگر توضیحی دارید اینجا بنویسید"></textarea>
                    </div>
                    <button type="submit" class="submit-order-btn">ثبت سفارش</button>
                </form>
                <p id="checkoutMessage" class="checkout-message"></p>
            </div>
            <!-- خلاصه سفارش -->
            <div class="order-summary-section">
                <h2>خلاصه سفارش</h2>
                <div id="checkout-cart-items" class="checkout-cart-items"></div>
                <div class="summary-box">
                    <div class="summary-row">
                        <span>تعداد کل آیتم‌ها:</span>
                        <span id="total-items">0</span>
                    </div>
                    <div class="discount-box">
                        <label for="discountCode">کد تخفیف</label>

                        <div class="discount-input-group">
                            <input type="text"
                                   id="discountCode"
                                   maxlength="8"
                                   placeholder="کد تخفیف را وارد کنید">

                            <button type="button" id="applyDiscountBtn">
                                اعمال
                            </button>
                        </div>

                        <div id="discountMessage" class="discount-message"></div>
                    </div>

                    <div class="summary-row">
                        <span>تخفیف:</span>
                        <span id="discountAmount">0 تومان</span>
                    </div>
                    <div class="summary-row total-row">
                        <span>مبلغ کل:</span>
                        <span id="checkout-total">0 تومان</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/checkout.js"></script>
</body>
</html>
